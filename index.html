    // Высчитываем общую длину сетки вещания

    var player;
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
        // Вычисляем, какое видео должно играть СЕЙЧАС и с какой секунды
        const now = new Date();
        // Количество секунд с начала текущего дня (по Гринвичу или локальному времени)
        const secondsSinceMidnight = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();

        // Позиция эфира в текущем суточном круге
        const currentPlaylistTime = secondsSinceMidnight % TOTAL_DURATION;

        let accumulatedTime = 0;
        let targetVideo = SCHEDULE[0];
        let startSeconds = 0;

        for (let i = 0; i < SCHEDULE.length; i++) {
            accumulatedTime += SCHEDULE[i].duration;
            if (currentPlaylistTime < accumulatedTime) {
                targetVideo = SCHEDULE[i];
                startSeconds = currentPlaylistTime - (accumulatedTime - SCHEDULE[i].duration);
                break;
            }
        }

        player = new YT.Player('player', {
            videoId: targetVideo.id,
            playerVars: {
                'autoplay': 1,
                'controls': 0,
                'disablekb': 1,
                'fs': 0,
                'modestbranding': 1,
                'rel': 0,
                'start': Math.floor(startSeconds) // Запуск с точной синхронизированной секунды
            },
            events: {
                'onReady': onPlayerReady,
                'onStateChange': onPlayerStateChange
            }
        });
    }

    function startTV() {
        document.getElementById('unmute-overlay').style.display = 'none';
        if (player) {
            player.playVideo();
            player.unMute();
        }
    }

    function onPlayerReady(event) {
        updateTVGuide();
    }

    function onPlayerStateChange(event) {
        // Когда текущее видео заканчивается (состояние 0), можно переключать на следующее по порядку
        if (event.data === YT.PlayerState.ENDED) {
            playNextInSync();
        }
    }

    function playNextInSync() {
        // Пересчитываем точное видео по времени на случай рассинхрона
        const now = new Date();
        const secondsSinceMidnight = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
        const currentPlaylistTime = secondsSinceMidnight % TOTAL_DURATION;

        let accumulatedTime = 0;
        for (let i = 0; i < SCHEDULE.length; i++) {
            accumulatedTime += SCHEDULE[i].duration;
            if (currentPlaylistTime < accumulatedTime) {
                let startSeconds = currentPlaylistTime - (accumulatedTime - SCHEDULE[i].duration);
                player.loadVideoById({
                    'videoId': SCHEDULE[i].id,
                    'startSeconds': Math.floor(startSeconds)
                });
                break;
            }
        }
        updateTVGuide();
    }

    function updateTVGuide() {
        if (!player || typeof player.getVideoData !== 'function') return;
        try {
            const data = player.getVideoData();
            if (data && data.title) {
                document.getElementById('current-title').innerText = data.title;
            }
        } catch (e) {}
    }
